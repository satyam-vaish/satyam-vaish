<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.12)" />
      <stop offset="100%" stop-color="rgba(8, 11, 17, 0)" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.09)" />
      <stop offset="100%" stop-color="rgba(8, 11, 17, 0)" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 17px; fill: #94A3B8; letter-spacing: 3px; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg)" />
  <rect width="1200" height="280" rx="16" fill="url(#glow)" />
  <rect width="1200" height="280" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Accent top line -->
  <path d="M 40 1 L 280 1" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M 920 1 L 1160 1" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" />

  <!-- Main Content Centered -->
  <g transform="translate(600, 110)">
    <!-- Main Name -->
    <text class="title" text-anchor="middle" fill="url(#gold)">SATYAM VAISH</text>
    
    <!-- Subtitle -->
    <text class="subtitle" text-anchor="middle" y="44">FULL-STACK ENGINEER  •  PRODUCTION MLOPS  •  AGENTIC AI</text>
    
    <!-- Pills/Badges -->
    <g transform="translate(0, 82)">
      <!-- Pill 1: Oracle Certified -->
      <g transform="translate(-270, 0)">
        <rect x="-115" y="-14" width="230" height="28" rx="14" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
        <circle cx="-95" cy="0" r="4" fill="#F59E0B" />
        <text class="pill" text-anchor="middle" x="8" y="4" fill="#FBBF24">ORACLE AGENTIC AI</text>
      </g>
      
      <!-- Pill 2: LPU CSE -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="-75" cy="0" r="4" fill="#94A3B8" />
        <text class="pill" text-anchor="middle" x="8" y="4" fill="#CBD5E1">B.TECH CSE @ LPU</text>
      </g>
      
      <!-- Pill 3: LeetCode 100+ -->
      <g transform="translate(260, 0)">
        <rect x="-105" y="-14" width="210" height="28" rx="14" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
        <circle cx="-85" cy="0" r="4" fill="#06B6D4" />
        <text class="pill" text-anchor="middle" x="8" y="4" fill="#38BDF8">LEETCODE 100+ SOLVED</text>
      </g>
    </g>
  </g>
</svg>
