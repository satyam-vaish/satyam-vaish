<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="290">
  <defs>
    <!-- Vibrant Neon Gradients -->
    <linearGradient id="vibrant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="35%" stop-color="#120c24" />
      <stop offset="70%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040b14" />
    </linearGradient>
    <linearGradient id="vibrant-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="25%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.5" />
    </linearGradient>
    <!-- Glowing Radials -->
    <radialGradient id="glow-magenta" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 0, 122, 0.25)" />
      <stop offset="100%" stop-color="rgba(10, 5, 24, 0)" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(4, 11, 20, 0)" />
    </radialGradient>
    <radialGradient id="glow-gold" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="rgba(255, 230, 0, 0.16)" />
      <stop offset="100%" stop-color="rgba(10, 5, 24, 0)" />
    </radialGradient>
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .vibrant-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 56px; letter-spacing: 3px; }
    .vibrant-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #E2E8F0; letter-spacing: 3px; }
    .vibrant-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="290" rx="18" fill="url(#vibrant-bg)" />
  <rect width="1200" height="290" rx="18" fill="url(#glow-magenta)" />
  <rect width="1200" height="290" rx="18" fill="url(#glow-cyan)" />
  <rect width="1200" height="290" rx="18" fill="url(#glow-gold)" />
  <rect width="1200" height="290" rx="18" fill="url(#cyber-grid)" />

  <!-- Ambient Wave Ribbons -->
  <path d="M 0 210 Q 300 160 600 220 T 1200 190 L 1200 290 L 0 290 Z" fill="url(#wave1)" />
  <path d="M 0 230 Q 300 270 600 210 T 1200 240 L 1200 290 L 0 290 Z" fill="url(#wave2)" />

  <!-- Vibrant Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="287" rx="17" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  <path d="M 30 1.5 L 350 1.5" stroke="#FF007A" stroke-width="3" stroke-linecap="round" />
  <path d="M 400 1.5 L 800 1.5" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M 850 1.5 L 1170 1.5" stroke="#00FF88" stroke-width="3" stroke-linecap="round" />

  <!-- Center Content -->
  <g transform="translate(600, 115)">
    <!-- Main Radiant Title -->
    <text class="vibrant-title" text-anchor="middle" fill="url(#vibrant-text)">SATYAM VAISH</text>

    <!-- Subtitle -->
    <text class="vibrant-subtitle" text-anchor="middle" y="44">⚡ FULL-STACK ENGINEER  •  PRODUCTION MLOPS  •  AGENTIC AI</text>

    <!-- Chips / Badges Row -->
    <g transform="translate(0, 84)">
      <!-- Chip 1: Oracle Certified -->
      <g transform="translate(-250, 0)">
        <rect x="-110" y="-14" width="220" height="28" rx="14" fill="rgba(255, 0, 122, 0.18)" stroke="#FF007A" stroke-width="1.2" />
        <circle cx="-90" cy="0" r="4.5" fill="#FF007A" />
        <text class="vibrant-pill" text-anchor="middle" x="10" y="4" fill="#FF85C0">ORACLE AGENTIC AI</text>
      </g>

      <!-- Chip 2: LPU CSE -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.2" />
        <circle cx="-75" cy="0" r="4.5" fill="#00F0FF" />
        <text class="vibrant-pill" text-anchor="middle" x="10" y="4" fill="#80F7FF">B.TECH CSE @ LPU</text>
      </g>

      <!-- Chip 3: CREDENCE Engine -->
      <g transform="translate(250, 0)">
        <rect x="-110" y="-14" width="220" height="28" rx="14" fill="rgba(0, 255, 136, 0.15)" stroke="#00FF88" stroke-width="1.2" />
        <circle cx="-90" cy="0" r="4.5" fill="#00FF88" />
        <text class="vibrant-pill" text-anchor="middle" x="10" y="4" fill="#6EE7B7">CREDENCE RISK ENGINE</text>
      </g>
    </g>
  </g>
</svg>
